<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cruciverba R.P.M. — (MIS)UNDERSTANDING MEDIA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee9e2;color:#222;font-family:Arial,sans-serif}main{max-width:760px;margin:auto;padding:12px}.sheet{position:relative;width:100%;line-height:0}.sheet img{display:block;width:100%;height:auto}.letter{position:absolute;display:block;border:0;border-radius:0;background:transparent;color:#111;text-align:center;font-family:Arial,sans-serif;font-weight:700;font-size:clamp(10px,3.1vw,25px);padding:0;margin:0;outline:0;line-height:1;caret-color:#124e9d}.letter:focus{background:rgba(255,240,130,.55);outline:2px solid #145aa1;outline-offset:-2px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button,.link{display:inline-block;padding:12px 16px;background:#17529a;color:white;border:0;border-radius:6px;font-size:16px;cursor:pointer;text-decoration:none}.note{font-size:13px;line-height:1.5}@media(min-width:760px){.letter{font-size:24px}}
</style>
</head>
<body><main>
<div class="sheet" id="sheet"><img src="Cruciverba%20R.P.M.jpg" alt="Cruciverba R.P.M. con definizioni" onerror="this.src='https://raw.githubusercontent.com/fabiborrata1-create/cruciverba-rpm/main/Cruciverba%20R.P.M.jpg'"></div>
<div class="controls"><button type="button" id="erase">Cancella lettere</button><a class="link" href="soluzioni.html">Scopri le soluzioni</a></div>
<p class="note">Clicca o tocca una casella per scrivere. Usa le frecce per spostarti. Le lettere vengono conservate su questo dispositivo.</p>
</main>
<script>
// Coordinate misurate sull'immagine originale (riferimento 1024 × 1448).
const W=1024,H=1448,dx=48.3,dy=48.9;
const entries=[
 {x:109,y:484,n:13,d:'h'}, // 1 VIDEOSCULTURE
 {x:206,y:389,n:5,d:'v'},  // 2 MEDIA
 {x:495,y:286,n:9,d:'h'},  // 3 MADDALONI
 {x:301,y:385,n:8,d:'v'},  // 4 GIOCONDA
 {x:400,y:232,n:9,d:'v'},  // 5 MONOSCOPI
 {x:495,y:286,n:7,d:'v'},  // 6 MARILYN
 {x:350,y:729,n:5,d:'v'},  // 7 MUSEO
 {x:638,y:438,n:6,d:'v'},  // 8 TRIBAL (6 caselle)
 {x:495,y:385,n:3,d:'h'},  // 9 RPM
 {x:301,y:729,n:3,d:'h'},  // 10 AMA
 {x:639,y:629,n:4,d:'h'}   // 11 ARTE
];
const sheet=document.getElementById('sheet'), cellMap=new Map(), sequences=[];
function key(x,y){return Math.round(x/dx)+','+Math.round(y/dy)}
function createCell(x,y){const k=key(x,y);if(cellMap.has(k))return cellMap.get(k);const el=document.createElement('input');el.className='letter';el.type='text';el.inputMode='text';el.autocapitalize='characters';el.autocomplete='off';el.spellcheck=false;el.maxLength=1;el.setAttribute('aria-label','Casella del cruciverba');el.style.left=(x/W*100)+'%';el.style.top=(y/H*100)+'%';el.style.width=(dx/W*100)+'%';el.style.height=(dy/H*100)+'%';el.value=localStorage.getItem('rpm-cell-'+k)||'';sheet.appendChild(el);cellMap.set(k,el);return el}
for(const e of entries){const seq=[];for(let i=0;i<e.n;i++)seq.push(createCell(e.x+(e.d==='h'?i*dx:0),e.y+(e.d==='v'?i*dy:0)));sequences.push(seq)}
for(const [k,el] of cellMap){el.addEventListener('input',()=>{el.value=el.value.replace(/[^a-zA-ZÀ-ÿ]/g,'').slice(-1).toUpperCase();localStorage.setItem('rpm-cell-'+k,el.value);if(el.value){const seq=sequences.find(s=>s.includes(el)&&s.indexOf(el)<s.length-1);if(seq)seq[seq.indexOf(el)+1].focus()}});el.addEventListener('keydown',ev=>{if(ev.key==='Backspace'&&!el.value){const seq=sequences.find(s=>s.indexOf(el)>0);if(seq){ev.preventDefault();seq[seq.indexOf(el)-1].focus()}}}})}
document.getElementById('erase').addEventListener('click',()=>{if(confirm('Cancellare tutte le lettere?'))for(const [k,el] of cellMap){el.value='';localStorage.removeItem('rpm-cell-'+k)}});
</script></body></html>
