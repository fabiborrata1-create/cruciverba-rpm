<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cruciverba R.P.M.</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#eee9e2;color:#222}main{max-width:760px;margin:0 auto;padding:12px}h1{font-size:20px;margin:8px 0 12px;text-align:center}.sheet{position:relative;width:100%;line-height:0}.sheet img{display:block;width:100%;height:auto}.letter{position:absolute;display:block;border:0;border-radius:0;background:transparent;color:#121212;text-align:center;font-family:Arial,sans-serif;font-weight:700;font-size:clamp(11px,3.1vw,25px);padding:0;margin:0;outline:0;line-height:1;caret-color:#124e9d}.letter:focus{background:rgba(255,240,130,.6);outline:2px solid #145aa1;outline-offset:-2px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button{padding:12px 16px;background:#17529a;color:white;border:0;border-radius:6px;font-size:16px;cursor:pointer}.note{font-size:13px;line-height:1.4} @media(min-width:760px){.letter{font-size:24px}}
</style></head><body><main><h1>Cruciverba interattivo R.P.M.</h1><div class="sheet" id="sheet"><img src="Cruciverba%20R.P.M.jpg" alt="Cruciverba R.P.M. con definizioni"></div><div class="controls"><button type="button" id="erase">Cancella lettere</button></div><p class="note">Tocca una casella per scrivere una lettera. Puoi spostarti con le frecce della tastiera. Le lettere rimangono finché questa pagina resta aperta.</p></main>
<script>
// Coordinate in riferimento all'immagine originale, visualizzata su una base 1024 × 1448.
const W=1024,H=1448,stepX=48.3,stepY=48.9;
const entries=[
 {x:109,y:484,n:13,dir:'h'}, // 1 VIDEOSCULTURE
 {x:206,y:389,n:5,dir:'v'}, // 2 MEDIA
 {x:495,y:286,n:9,dir:'h'}, // 3 MADDALONI
 {x:301,y:385,n:8,dir:'v'}, // 4 GIOCONDA
 {x:400,y:232,n:9,dir:'v'}, // 5 MONOSCOPI
 {x:495,y:286,n:7,dir:'v'}, // 6 MARILYN
 {x:350,y:729,n:5,dir:'v'}, // 7 MUSEO
 {x:638,y:438,n:6,dir:'v'}, // 8 (6 caselle nel disegno)
 {x:495,y:385,n:3,dir:'h'}, // 9 RPM
 {x:301,y:729,n:3,dir:'h'}, // 10 AMA
 {x:639,y:629,n:4,dir:'h'} // 11 ARTE
];
const sheet=document.getElementById('sheet');const cells=new Map();
function addCell(x,y){const key=Math.round(x/stepX)+','+Math.round(y/stepY);if(cells.has(key))return cells.get(key);
 const el=document.createElement('input');el.className='letter';el.type='text';el.inputMode='text';el.autocapitalize='characters';el.autocomplete='off';el.spellcheck=false;el.maxLength=1;el.setAttribute('aria-label','Casella del cruciverba');
 el.style.left=(x/W*100)+'%';el.style.top=(y/H*100)+'%';el.style.width=(stepX/W*100)+'%';el.style.height=(stepY/H*100)+'%';sheet.appendChild(el);cells.set(key,el);return el;}
// Identifica le caselle per posizione, così le intersezioni sono un'unica casella.
const coordMap=new Map();const sequences=[];
for(const e of entries){const seq=[];for(let i=0;i<e.n;i++){const x=e.x+(e.dir==='h'?i*stepX:0),y=e.y+(e.dir==='v'?i*stepY:0);const gx=Math.round(x/stepX),gy=Math.round(y/stepY),key=gx+','+gy;let input=coordMap.get(key);if(!input){input=addCell(x,y);coordMap.set(key,input)}seq.push(input)}sequences.push(seq)}
for(const seq of sequences){seq.forEach((el,i)=>{el.addEventListener('input',()=>{el.value=el.value.replace(/[^a-zA-ZÀ-ÿ]/g,'').slice(-1).toUpperCase();if(el.value&&seq[i+1])seq[i+1].focus()});el.addEventListener('keydown',ev=>{if(ev.key==='Backspace'&&!el.value&&seq[i-1]){ev.preventDefault();seq[i-1].focus()}})})}
document.getElementById('erase').addEventListener('click',()=>{if(confirm('Cancellare tutte le lettere?'))for(const el of coordMap.values())el.value=''})
</script></body></html>
