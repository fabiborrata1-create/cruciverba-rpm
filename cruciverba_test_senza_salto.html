<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cruciverba R.P.M. — versione smartphone</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee9e2;color:#222;font:16px Arial,sans-serif}main{max-width:760px;margin:auto;padding:10px 10px 170px}.sheet{position:relative;width:100%;line-height:0}.sheet img{display:block;width:100%;height:auto}.cell{position:absolute;border:0;padding:0;margin:0;background:transparent;color:#111;font:bold clamp(10px,2.7vw,23px) Arial,sans-serif;text-align:center;line-height:1;cursor:pointer;touch-action:manipulation}.cell.selected{background:rgba(255,226,89,.7);outline:2px solid #1261a0;outline-offset:-2px}.editor{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:min(740px,calc(100% - 16px));background:#fff;padding:12px;border:2px solid #17529a;border-radius:12px;box-shadow:0 -3px 20px #0002;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:20;margin-top:10px}.editor label{font-weight:700;flex:1 0 100%}.editor input{width:110px;min-width:0;padding:12px;border:2px solid #17529a;border-radius:8px;font:22px Arial;text-transform:uppercase}.editor button,.actions button,.actions a{background:#17529a;color:white;border:0;border-radius:7px;padding:12px;font:15px Arial;text-decoration:none;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hint{font-size:14px;line-height:1.4}.editor button:disabled{opacity:.45}@media(min-width:700px){.cell{font-size:22px}}
</style></head><body><main><div class="sheet" id="sheet"><img src="Cruciverba%20R.P.M.jpg" alt="Cruciverba originale con definizioni" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='https://raw.githubusercontent.com/fabiborrata1-create/cruciverba-rpm/main/Cruciverba%20R.P.M.jpg'}"></div><div class="actions"><button id="clear" type="button">Cancella lettere</button><a href="soluzioni.html">Scopri le soluzioni</a></div><p class="hint">Tocca una casella della griglia, poi scrivi la lettera nel campo sempre visibile. Usa «Avanti» per passare alla successiva.</p><div class="editor"><label for="entry">Scrivi qui la lettera della casella selezionata</label><input id="entry" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" aria-label="Lettera da inserire"><button id="previous" type="button">← Indietro</button><button id="next" type="button">Avanti →</button></div></main><script>
'use strict';const W=1024,H=1448,dx=48.3,dy=48.9;
const words=[{x:109,y:484,n:13,d:'h'},{x:206,y:389,n:5,d:'v'},{x:495,y:286,n:9,d:'h'},{x:301,y:385,n:8,d:'v'},{x:400,y:232,n:9,d:'v'},{x:495,y:286,n:7,d:'v'},{x:350,y:729,n:5,d:'v'},{x:638,y:438,n:6,d:'v'},{x:495,y:385,n:3,d:'h'},{x:301,y:729,n:3,d:'h'},{x:639,y:629,n:4,d:'h'}];
const sheet=document.getElementById('sheet'),entry=document.getElementById('entry');const cells=new Map(),sequences=[];let selected=null,activeSequence=null;
function key(x,y){return Math.round(x/dx)+','+Math.round(y/dy)}
function store(k,v){try{localStorage.setItem('rpm-new-'+k,v)}catch(e){}}
function load(k){try{return localStorage.getItem('rpm-new-'+k)||''}catch(e){return ''}}
function choose(k,focus=true){if(selected&&cells.has(selected))cells.get(selected).classList.remove('selected');selected=k;const cell=cells.get(k);cell.classList.add('selected');entry.value=cell.textContent||'';const matching=sequences.filter(s=>s.includes(k));if(!activeSequence||!activeSequence.includes(k))activeSequence=matching[0]||null;if(focus){try{entry.focus({preventScroll:true})}catch(e){entry.focus()}}}
for(const w of words){let seq=[];for(let i=0;i<w.n;i++){const x=w.x+(w.d==='h'?i*dx:0),y=w.y+(w.d==='v'?i*dy:0),k=key(x,y);seq.push(k);if(!cells.has(k)){const b=document.createElement('button');b.type='button';b.className='cell';b.setAttribute('aria-label','Seleziona casella');b.style.left=(x/W*100)+'%';b.style.top=(y/H*100)+'%';b.style.width=(dx/W*100)+'%';b.style.height=(dy/H*100)+'%';b.textContent=load(k);b.addEventListener('click',()=>choose(k));sheet.appendChild(b);cells.set(k,b)}}sequences.push(seq)}
function move(delta){if(!selected||!activeSequence)return;let i=activeSequence.indexOf(selected);if(i<0)return;const j=i+delta;if(j>=0&&j<activeSequence.length)choose(activeSequence[j],false)}
entry.addEventListener('input',()=>{if(!selected)return;const v=entry.value.replace(/[^a-zA-ZÀ-ÿ]/g,'').slice(-1).toUpperCase();entry.value=v;cells.get(selected).textContent=v;store(selected,v);if(v)move(1)});
entry.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!entry.value){move(-1);entry.value='';if(selected){cells.get(selected).textContent='';store(selected,'')}}if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});
document.getElementById('next').addEventListener('click',()=>{move(1);entry.focus({preventScroll:true})});document.getElementById('previous').addEventListener('click',()=>{move(-1);entry.focus({preventScroll:true})});document.getElementById('clear').addEventListener('click',()=>{if(!confirm('Cancellare tutte le lettere?'))return;for(const [k,b] of cells){b.textContent='';store(k,'')}entry.value=''});
const first=sequences[0][0];choose(first,false);
</script></body></html>
